<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liste">
<meta name="theme-color" content="#E6E9ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151922" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Liste</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#E6E9ED;--surface:#F1F3F6;--tile:linear-gradient(145deg,#DADFE6 0%,#EBEEF2 100%);--raise:linear-gradient(145deg,#F5F7FA 0%,#E0E5EB 100%);--tile-p:linear-gradient(145deg,#D9D3EE 0%,#E9ECF3 100%);--raise-p:linear-gradient(145deg,#E4DEF4 0%,#EEF0F6 55%,#DADFE9 100%);--sh-in-p:inset 0 0 0 1px rgba(140,110,225,.28),inset 0 2px 5px rgba(110,80,190,.20),inset 0 -1px 0 rgba(255,255,255,.8);--sh-in-ps:inset 0 0 0 1px rgba(140,110,225,.16),inset 0 1px 3px rgba(110,80,190,.12);--sh-out-p:0 2px 8px rgba(110,80,190,.20),inset 0 0 0 1px rgba(140,110,225,.30),inset 0 1px 0 rgba(255,255,255,.9);--sh-in:inset 0 1px 3px rgba(70,85,110,.18),inset 0 -1px 0 rgba(255,255,255,.85);--sh-in-s:inset 0 1px 2px rgba(70,85,110,.10),inset 0 -1px 0 rgba(255,255,255,.7);--sh-out:0 2px 6px rgba(70,85,110,.16),inset 0 1px 0 rgba(255,255,255,.95);--text:#12161C;--text-secondary:#4B5361;--text-muted:#7A8290;
  --line:#D9DDE2;--hero:#1B2540;--hero-ink:#F4F1EA;--gold:#8E7CE6;--chip:#E3E6EA;
  --gold-ink:#6A55D0;--btn:linear-gradient(135deg,#7D82B6,#9082B3);--btn-bar:linear-gradient(90deg,#8D9BD2,#A08DCB);--btn-sh:0 4px 12px rgba(90,80,150,.22),inset 0 1px 0 rgba(255,255,255,.22);--btn-sh-lg:0 8px 20px rgba(90,80,150,.26),inset 0 1px 0 rgba(255,255,255,.22);--danger:#B3402F;--warn:#B98A2E;--accent:#12161C;--accent-muted:#E3E6EA;--accent-border:#12161C;
  --grad:#C2A468;--scrim:rgba(10,12,16,.45);
  --neb:radial-gradient(60% 45% at 92% 6%,rgba(150,110,230,.30),transparent 70%),radial-gradient(55% 40% at 4% 38%,rgba(100,140,235,.24),transparent 70%),radial-gradient(70% 45% at 70% 98%,rgba(170,120,230,.22),transparent 70%);--serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#151922;--surface:#1A1F2A;--tile:linear-gradient(145deg,#0F131A 0%,#1C222E 100%);--raise:linear-gradient(145deg,#262D3C 0%,#1B2130 100%);--tile-p:linear-gradient(145deg,#241B3E 0%,#171C2A 100%);--raise-p:linear-gradient(145deg,#33284F 0%,#1E2335 100%);--sh-in-p:inset 0 0 0 1px rgba(160,130,240,.30),inset 0 2px 6px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.04);--sh-in-ps:inset 0 0 0 1px rgba(160,130,240,.16),inset 0 1px 3px rgba(0,0,0,.4);--sh-out-p:0 2px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(160,130,240,.34),inset 0 1px 0 rgba(255,255,255,.07);--sh-in:inset 0 1px 3px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.04);--sh-in-s:inset 0 1px 2px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.03);--sh-out:0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);--text:#EEF0F3;--text-secondary:#B4BBC8;--text-muted:#8A93A3;--line:#262C38;--hero:#202B4B;--chip:#222836;--gold-ink:#B7A6FF;--btn:linear-gradient(135deg,#474C82,#574A84);--btn-bar:linear-gradient(90deg,#5A68B0,#7A62B0);--btn-sh:0 4px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.10);--btn-sh-lg:0 8px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.10);--danger:#E8806F;--warn:#D9AE55;--accent:#EEF0F3;--accent-muted:#222836;--accent-border:#EEF0F3;--scrim:rgba(0,0,0,.6);--gold:#A18BF2;--neb:radial-gradient(60% 45% at 92% 6%,rgba(130,90,225,.34),transparent 70%),radial-gradient(55% 40% at 4% 38%,rgba(60,100,225,.28),transparent 70%),radial-gradient(70% 45% at 70% 98%,rgba(150,80,200,.22),transparent 70%)}}
html,body{height:100%}
body{min-height:100dvh;font-family:var(--sans);font-size:16px;color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.noise{display:none}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 0 calc(120px + var(--safe-bottom));min-height:100dvh}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Kopf */
.header{position:sticky;top:0;z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 6px;background:var(--bg)}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.list-switcher{display:flex;align-items:baseline;gap:10px;cursor:pointer;max-width:72%}
.list-name{font:400 34px/1.1 var(--serif);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-chevron{font-size:13px;color:var(--text-muted);flex-shrink:0}
.header-actions{display:flex;gap:8px}
.h-btn{width:42px;height:42px;border-radius:50%;border:0;box-shadow:var(--sh-out);background:var(--raise);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.h-btn:active{transform:scale(.92)}

/* Summe */
.stats{margin:4px 20px 14px;background:var(--raise-p);color:var(--text);box-shadow:var(--sh-out-p);border-radius:20px;padding:14px 18px 14px;display:flex;flex-direction:column}
.price-row{order:1;display:flex;flex-direction:row;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.price-row>div{display:flex;flex-direction:column;gap:2px}
.price-row>div:last-child{align-items:flex-end!important;text-align:right!important}
.price-label{font-size:12px;color:var(--text-muted);opacity:1;font-family:var(--sans)}
.price-total{font:400 34px/1 var(--serif);letter-spacing:-.02em;color:var(--text);font-variant-numeric:lining-nums}
.price-done{font:400 19px/1 var(--serif);color:var(--gold-ink)}
.price-row>div:last-child .price-label{order:2}
.stats-row{order:2;display:flex;align-items:center;gap:10px;font-size:13px}
.stat-nums{color:var(--text-secondary);font-weight:400;flex-shrink:0}
.stat-nums b{font-weight:600;color:var(--text)}
.prog{flex:1;height:5px;background:var(--tile);box-shadow:var(--sh-in);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:var(--btn-bar);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog-pct{color:var(--gold-ink);font-weight:600;min-width:30px;text-align:right}
.budget-wrap{order:3;margin-top:10px}
.budget-wrap span{color:var(--text-secondary)!important}
.budget-bar{height:5px;background:var(--tile);box-shadow:var(--sh-in);border-radius:99px;overflow:hidden;margin-top:5px}
.budget-fill{height:100%;border-radius:99px;background:var(--btn-bar);transition:width .4s}
.budget-over{background:#E8806F}
.stats.no-prices .price-row,.stats.no-prices .budget-wrap{display:none}
.stats.no-prices .stats-row{margin:2px 0}

/* Suche */
.search-wrap{padding:0 0 10px;display:none}
.search-wrap.show{display:block}
.search-box{position:relative}
.search-inp{width:100%;background:var(--tile);border:0;box-shadow:var(--sh-in);border-radius:16px;color:var(--text);padding:13px 16px 13px 42px;font:400 18px var(--sans);outline:none}
.search-inp:focus{box-shadow:var(--sh-in),0 0 0 2px var(--gold)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

/* Liste */
.list-wrap{padding:0 20px}
.section-hd{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 0}
.section-lbl{font:400 21px var(--serif);color:var(--text)}
.sec-btn{background:none;border:0;color:var(--text-muted);font-size:14px;cursor:pointer;padding:4px 0}
.sec-btn:active{color:var(--text)}
.store-group{display:flex;align-items:baseline;gap:12px;margin:22px 0 0;padding:0 4px 2px;border-bottom:0;font:italic 400 22px var(--serif);color:var(--text)}
.store-group.everywhere{color:var(--text)}
.grp-price{margin-left:auto;font:400 17px var(--serif);font-style:normal;color:var(--text-muted);background:none;padding:0}
.item{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-top:12px;border-radius:18px;background:var(--tile-p);box-shadow:var(--sh-in-p);cursor:pointer;position:relative;transition:opacity .2s,box-shadow .2s}
.item:active{opacity:.75}
.item.done{opacity:.6;box-shadow:var(--sh-in-ps)}
.item.done .item-name,.item.done .item-price{text-decoration:line-through;text-decoration-thickness:1px;color:var(--text-muted)}
.item.prio-high{box-shadow:var(--sh-in-p),inset 3px 0 0 var(--danger)}
.item.prio-med{box-shadow:var(--sh-in-p),inset 3px 0 0 var(--warn)}
.item-check{width:26px;height:26px;border-radius:50%;border:0;box-shadow:var(--sh-out);background:var(--raise);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.item.done .item-check{background:var(--text);box-shadow:none}
.item-check-mark{font-size:13px;color:var(--bg);font-weight:700;opacity:0;line-height:1}
.item.done .item-check-mark{opacity:1}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column}
.item-name{font-size:16.5px;font-weight:500;line-height:1.3;word-break:break-word}
.item-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.meta-pill,.meta-store{font-size:13px;color:var(--text-muted)}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.item-qty{font-size:14px;color:var(--text-muted);font-weight:400}
.item-price{font:400 19px var(--serif);color:var(--text);font-variant-numeric:lining-nums}
.empty{text-align:center;padding:3.5rem 1rem;color:var(--text-muted)}
.empty-icon{display:none}
.empty p{font:italic 400 21px/1.5 var(--serif);color:var(--text-muted)}

/* Untere Leiste */
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 22px calc(18px + var(--safe-bottom));background:linear-gradient(180deg,transparent,var(--bg) 45%);pointer-events:none}
.bottom-bar>*{pointer-events:auto}
.b-btn{width:52px;height:52px;border-radius:50%;border:0;box-shadow:var(--sh-out);background:var(--raise);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.b-btn:active{transform:scale(.94)}
.b-btn.add{width:auto;min-width:132px;height:56px;padding:0 34px;border-radius:99px;border:0;background:var(--text);color:var(--bg);font-size:26px;font-weight:300;box-shadow:0 14px 34px rgba(18,22,28,.3)}
.b-btn.add.open{background:var(--tile);color:var(--text);box-shadow:var(--sh-in-s)}

/* Eingabe */
.panel-scrim{position:fixed;inset:0;z-index:92;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.panel-scrim.open{opacity:1;pointer-events:auto}
.input-panel{position:fixed;left:0;right:0;bottom:0;z-index:95;max-width:520px;margin:0 auto;background:linear-gradient(180deg,var(--surface),var(--bg));border-radius:28px 28px 0 0;padding:10px 20px calc(20px + var(--safe-bottom));box-shadow:0 -20px 60px rgba(10,12,16,.25);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-height:92dvh;overflow-y:auto;touch-action:pan-y}
.input-panel.open{transform:none;pointer-events:auto}
.panel-handle{width:44px;height:5px;border-radius:99px;box-shadow:var(--sh-in-s);background:var(--bg);margin:0 auto 6px;cursor:grab}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel-title{font:400 24px var(--serif);color:var(--text)}
.panel-count{font:400 14px var(--sans);color:var(--text-muted);margin-left:8px}
.panel-close{background:var(--text);color:var(--bg);border:0;border-radius:99px;padding:11px 22px;font:500 15px var(--sans);cursor:pointer}
.panel-close:active{transform:scale(.96)}
.inp-row{display:flex}
.inp{flex:1;min-width:0;background:var(--tile);border:0;box-shadow:var(--sh-in);border-radius:18px;color:var(--text);padding:16px 18px;font:400 20px var(--sans);outline:none}
.inp:focus{box-shadow:var(--sh-in),0 0 0 2px var(--gold)}
.inp::placeholder{color:var(--text-muted)}
.extra-row{display:flex;gap:10px;margin-top:10px;align-items:center}
.qty-ctrl{display:flex;align-items:center;background:var(--tile);box-shadow:var(--sh-in);border-radius:18px;overflow:hidden;flex-shrink:0}
.qty-btn{background:none;border:0;color:var(--text);min-width:46px;height:54px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-btn:active{background:var(--chip)}
.qty-num{font-size:18px;font-weight:500;min-width:2.6ch;width:2.6ch;text-align:center;color:var(--text);background:none;border:0;outline:none;font-family:inherit;padding:0}
.price-wrap{position:relative;flex:1;min-width:90px}
.price-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:17px;pointer-events:none}
.price-inp{padding:0 12px 0 36px!important;width:100%;height:54px;font-size:18px}
.fav-btn{width:54px;height:54px;border-radius:18px;border:0;box-shadow:var(--sh-out);background:var(--raise);color:var(--text-muted);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fav-btn.active{color:var(--warn);box-shadow:var(--sh-in-s)}
.quick-row{display:flex;gap:10px;margin-top:10px}
.store-pick-sm{flex:1;min-width:0;background:var(--raise);border:0;box-shadow:var(--sh-out);border-radius:18px;color:var(--text-secondary);font-size:15px;padding:15px 14px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-pick-sm.has{box-shadow:var(--sh-in-s);color:var(--text);font-weight:600}
.add-btn{width:100%;margin-top:14px;padding:18px;border-radius:99px;border:0;cursor:pointer;background:var(--text);color:var(--bg);font:500 17px var(--sans);transition:transform .1s}
.add-btn:active{transform:scale(.985)}

/* Fenster */
.modal-bg{display:none;position:fixed;inset:0;background:var(--scrim);z-index:300;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:30px 30px 0 0;padding:28px 24px calc(26px + var(--safe-bottom));width:100%;max-width:520px;animation:slideUp .3s cubic-bezier(.2,.8,.2,1);position:relative;max-height:90dvh;overflow-y:auto}
.modal.center{border-radius:28px;margin:auto 16px;max-height:84dvh}
@keyframes slideUp{from{transform:translateY(50px);opacity:.6}to{transform:none;opacity:1}}
.modal h2{font:400 32px var(--serif);color:var(--text);margin-bottom:20px;letter-spacing:-.01em}
.modal label{font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px}
.modal input,.modal select,.modal textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--text);padding:6px 0 10px;font:400 18px var(--sans);outline:none;margin-bottom:16px}
.modal select{background:var(--surface)}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--text)}
.modal textarea{resize:vertical;min-height:60px}
.modal-btns{display:flex;gap:8px;margin-top:8px}
.m-save{flex:1.3;padding:15px;border-radius:99px;border:0;cursor:pointer;background:var(--text);color:var(--bg);font:500 15px var(--sans)}
.m-cancel{flex:1;padding:15px;border-radius:99px;cursor:pointer;background:none;border:1px solid var(--line);color:var(--text-secondary);font:500 15px var(--sans)}
.m-danger{color:var(--danger);border-color:var(--danger)}
.settings-section{margin-bottom:26px}
.settings-section-title{font:400 22px var(--serif);color:var(--text);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--text)}
.list-item-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item-row.active .l-name{font-weight:600}
.list-item-row .l-name{flex:1;font-size:17px}
.list-item-row .l-count{font-size:14px;color:var(--text-muted)}
.list-item-row .l-check{opacity:0;color:var(--text)}
.list-item-row.active .l-check{opacity:1}
.s-btn{width:100%;padding:15px;border-radius:99px;border:0;cursor:pointer;background:var(--text);color:var(--bg);font:500 15px var(--sans);margin-top:10px}
.s-btn.ghost{background:none;border:1px solid var(--line);color:var(--text-secondary);margin-top:8px}
.hint{font-size:13px;color:var(--text-muted);line-height:1.5;margin-top:-6px}
.store-popup-bg{display:none;position:fixed;inset:0;background:var(--scrim);z-index:350;align-items:flex-end;justify-content:center}
.store-popup-bg.open{display:flex}
.store-popup{background:var(--surface);border-radius:30px 30px 0 0;padding:26px 0 calc(18px + var(--safe-bottom));width:100%;max-width:520px;max-height:80dvh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
.store-popup-header{padding:0 24px 14px}
.store-popup-title{font:400 30px var(--serif);color:var(--text)}
.store-add-row{display:flex;gap:10px;padding:0 24px 14px;border-bottom:1px solid var(--text)}
.store-add-inp{flex:1;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:8px 0;font:400 17px var(--sans);outline:none}
.store-add-btn{background:var(--text);border:0;border-radius:50%;color:var(--bg);font-size:18px;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.store-list-item{display:flex;align-items:center;padding:15px 24px;font-size:17px;color:var(--text-secondary);border-bottom:1px solid var(--line);gap:8px;cursor:pointer}
.store-list-item:active{background:var(--chip)}
.store-list-item.selected{color:var(--text);font-weight:600}
.s-name{flex:1}
.s-check{opacity:0;font-size:14px}
.store-list-item.selected .s-check{opacity:1}
.store-del{background:none;border:0;color:var(--danger);opacity:.6;font-size:15px;cursor:pointer;padding:4px}

/* Hinweise */
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));bottom:auto;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:99px;font-size:14px;font-weight:500;z-index:700;white-space:nowrap;box-shadow:0 12px 30px rgba(10,12,16,.3);opacity:0;visibility:hidden;transition:all .3s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.show{transform:translateX(-50%);opacity:1;visibility:visible}
.toast .undo{background:none;border:0;color:var(--gold);font-weight:600;text-decoration:underline;cursor:pointer;font-size:14px;font-family:inherit}
.cd-bar{display:none;margin:0 20px 12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:10px 18px;font-size:14px;color:var(--text-secondary);align-items:center;gap:12px}
.cd-bar.show{display:flex}
.cd-fill-wrap{flex:1;height:2px;background:var(--line);overflow:hidden}
.cd-fill{height:100%;background:var(--gold);transition:width .1s linear}
.cd-undo{background:none;border:0;color:var(--danger);font-size:14px;cursor:pointer;text-decoration:underline;flex-shrink:0}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.filter-chip{background:none;border:1px solid var(--line);border-radius:99px;color:var(--text-secondary);font-size:14px;padding:8px 14px;cursor:pointer;transition:all .15s}
.filter-chip.active{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:500}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ═══ Premium-Feinschliff ═══ */
.item{touch-action:pan-y}
.item.pop{animation:pop .5s cubic-bezier(.2,1.25,.3,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.item.sw-r{box-shadow:var(--sh-in-p),inset 0 0 0 2px #4DB38A}
.item.sw-l{box-shadow:var(--sh-in-p),inset 0 0 0 2px var(--danger)}
.item{transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s,box-shadow .2s}
.sugg{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding:2px 2px 6px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg:empty{display:none}
.sugg button{flex:none;border:0;border-radius:99px;padding:10px 16px;background:var(--raise-p);box-shadow:var(--sh-out-p);color:var(--text);font:500 14px var(--sans);cursor:pointer}
.sugg button:active{transform:scale(.95)}
.sugg button.fav::before{content:'★ ';color:var(--gold-ink)}
.modal,.store-popup{background:linear-gradient(180deg,var(--surface),var(--bg));box-shadow:0 -18px 60px rgba(40,30,90,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.modal input,.modal select,.modal textarea,.store-add-inp{background:var(--tile);border:0;border-radius:14px;box-shadow:var(--sh-in);padding:14px 16px;margin-bottom:14px;color:var(--text)}
.store-add-inp{margin-bottom:0}
.modal input:focus,.modal select:focus,.modal textarea:focus,.store-add-inp:focus{box-shadow:var(--sh-in),0 0 0 2px var(--gold)}
.modal select{background:var(--tile)}
.m-save,.s-btn,.add-btn,.panel-close,.store-add-btn{background:var(--btn);color:#fff;box-shadow:var(--btn-sh)}
.s-btn.ghost,.m-cancel{background:var(--raise);border:0;box-shadow:var(--sh-out);color:var(--text-secondary)}
.m-danger{color:var(--danger)}
.list-item-row{background:var(--tile-p);box-shadow:var(--sh-in-ps);border:0;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.list-item-row.active{box-shadow:var(--sh-in-p)}
.store-list-item{margin:0 18px 10px;border:0;border-radius:16px;background:var(--tile-p);box-shadow:var(--sh-in-ps);padding:14px 16px}
.store-list-item.selected{box-shadow:var(--sh-in-p)}
.store-add-row{border-bottom:0;padding-bottom:14px}
.settings-section-title{border-bottom:1px solid rgba(140,110,225,.4)}
.filter-chip{background:var(--raise);border:0;box-shadow:var(--sh-out)}
.filter-chip.active{background:var(--btn);color:#fff;box-shadow:var(--btn-sh)}
.b-btn.add{background:var(--btn);color:#fff;box-shadow:var(--btn-sh-lg)}
.b-btn.add.open{background:var(--tile);color:var(--text);box-shadow:var(--sh-in-s)}
.toast{background:linear-gradient(135deg,#3A3F62,#473F66);color:#fff}
.toast .undo{color:#CBB8FF}
</style>
</head>
<body>
<div class="noise"></div>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="list-switcher" onclick="openListsModal()" title="Liste wechseln">
        <span class="list-name" id="currentListName">Einkauf</span>
        <span class="list-chevron">▾</span>
      </div>
      <div class="header-actions">
        <button class="h-btn" onclick="toggleSearch()" title="Suchen">⌕</button>
        <button class="h-btn" onclick="openSettings()" title="Einstellungen">⚙</button>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input class="search-inp" id="searchInp" type="search" placeholder="Artikel suchen…" autocomplete="off" oninput="render()">
      </div>
    </div>
  </div>

  <div class="stats no-prices" id="statsBar">
    <div class="stats-row">
      <div class="stat-nums"><b id="doneCount">0</b> / <b id="totalCount">0</b></div>
      <div class="prog"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-pct" id="progPct">—</div>
    </div>
    <div class="price-row">
      <div>
        <div class="price-label">Gesamt</div>
        <div class="price-total" id="priceTotal">0,00 €</div>
      </div>
      <div style="text-align:right">
        <div class="price-done" id="priceDone">0,00 €</div>
        <div class="price-label">im Korb</div>
      </div>
    </div>
    <div class="budget-wrap" id="budgetWrap" style="display:none">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:3px">
        <span>Budget</span>
        <span id="budgetLabel">0 / 0 €</span>
      </div>
      <div class="budget-bar"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="cd-bar" id="cdBar">
    <span id="cdText">Liste wird in 5s geleert…</span>
    <div class="cd-fill-wrap"><div class="cd-fill" id="cdFill" style="width:100%"></div></div>
    <button class="cd-undo" onclick="cancelAutoDelete()">Abbrechen</button>
  </div>

  <div class="list-wrap">
    <div class="section-hd">
      <span class="section-lbl" id="openLbl">Offen</span>
      <button class="sec-btn" onclick="clearAll()">Alle löschen</button>
    </div>
    <div id="listOpen"></div>
    <div id="doneSec" style="display:none">
      <div class="section-hd">
        <span class="section-lbl">Erledigt</span>
        <button class="sec-btn" onclick="clearDone()">Leeren</button>
      </div>
      <div id="listDone"></div>
    </div>
  </div>
</div>

<!-- INPUT PANEL -->
<div class="panel-scrim" id="panelScrim" onclick="toggleInputPanel(false)"></div>
<div class="input-panel" id="inputPanel">
  <div class="panel-handle" id="panelHandle"></div>
  <div class="panel-head">
    <div><span class="panel-title">Neuer Artikel</span><span class="panel-count" id="panelCount"></span></div>
    <button class="panel-close" onclick="toggleInputPanel(false)">Fertig</button>
  </div>
  <div class="inp-row">
    <input class="inp" id="inp" type="text" placeholder="Was brauchst du?" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="sugg" id="sugg"></div>
  <div class="extra-row">
    <div class="qty-ctrl">
      <button class="qty-btn" onclick="changeQty(-1)" aria-label="Weniger">−</button>
      <input class="qty-num" id="qtyVal" type="text" inputmode="numeric" value="1" aria-label="Menge">
      <button class="qty-btn" onclick="changeQty(1)" aria-label="Mehr">+</button>
    </div>
    <div class="price-wrap">
      <span class="price-icon">€</span>
      <input class="inp price-inp" id="priceInp" type="text" inputmode="decimal" placeholder="Preis" autocomplete="off">
    </div>
    <button class="fav-btn" id="favBtn" onclick="toggleFavorite()" title="Als Favorit merken">☆</button>
  </div>
  <div class="quick-row">
    <button class="store-pick-sm" id="storePickBtn" onclick="openStorePopup()">
      <span id="storePickLabel">Laden</span>
      <span>▾</span>
    </button>
    <button class="store-pick-sm" id="favPickBtn" onclick="openFavPopup()">
      <span>★ Favoriten</span>
    </button>
  </div>
  <button class="add-btn" onclick="addItem()">Hinzufügen</button>
</div>

<div class="bottom-bar">
  <button class="b-btn" onclick="shareList()" title="Teilen">↗</button>
  <button class="b-btn add" id="addToggleBtn" onclick="toggleInputPanel()" title="Hinzufügen">＋</button>
  <button class="b-btn" onclick="openSettings()" title="Mehr">⋯</button>
</div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="modalBg" onclick="bgClick(event)">
  <div class="modal">
    <h2>Artikel bearbeiten</h2>
    <label>Name</label>
    <input id="editName" type="text">
    <label>Menge</label>
    <input id="editQty" type="text" inputmode="numeric">
    <label>Preis (€)</label>
    <input id="editPrice" type="text" inputmode="decimal" placeholder="optional">
    <label>Priorität</label>
    <select id="editPrio">
      <option value="0">Normal</option>
      <option value="1">Mittel</option>
      <option value="2">Hoch</option>
    </select>
    <div class="modal-btns">
      <button class="m-cancel m-danger" onclick="deleteFromEdit()">Löschen</button>
      <button class="m-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="m-save" onclick="saveEdit()">Speichern</button>
    </div>
  </div>
</div>

<!-- LISTS MODAL -->
<div class="modal-bg" id="listsBg" onclick="if(event.target===this)closeListsModal()">
  <div class="modal center">
    <h2>Meine Listen</h2>
    <div id="listsContainer"></div>
    <div style="margin-top:14px">
      <label>Neue Liste</label>
      <input id="newListName" type="text" placeholder="Name der Liste" maxlength="40">
      <button class="s-btn" onclick="createList()">Liste erstellen</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div class="modal-bg" id="settingsBg" onclick="if(event.target===this)closeSettings()">
  <div class="modal center">
    <h2>Einstellungen</h2>
    <div class="settings-section">
      <div class="settings-section-title">Budget</div>
      <label>Monatsbudget / Listenbudget (€)</label>
      <input id="budgetInp" type="text" inputmode="decimal" placeholder="z.B. 80">
      <div class="hint">Leer lassen = kein Budget-Tracking</div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">Ort & Läden</div>
      <label>PLZ</label>
      <input id="settingsPlz" type="text" inputmode="numeric" placeholder="12345">
      <label>Stadt</label>
      <input id="settingsCity" type="text" placeholder="Berlin">
      <button class="s-btn" id="searchBtn" onclick="saveSettings()">Läden laden</button>
      <div id="searchProgress" style="display:none;margin-top:10px">
        <div style="height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden">
          <div id="searchProgressBar" style="height:100%;width:0%;background:var(--grad);transition:width .3s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px">
          <span id="searchProgressLabel">…</span>
          <span id="searchProgressPct">0%</span>
        </div>
      </div>
      <div id="savedLocationsList" style="margin-top:12px"></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">Kategorien-Filter (Laden-Suche)</div>
      <div class="filter-chips" id="filterChips"></div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">Backup</div>
      <button class="s-btn ghost" onclick="exportBackup()">Exportieren</button>
      <button class="s-btn ghost" onclick="document.getElementById('importFile').click()">Importieren</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)">
    </div>
    <button class="s-btn ghost" onclick="closeSettings()">Schließen</button>
  </div>
</div>

<!-- STORE POPUP -->
<div class="store-popup-bg" id="storePopupBg" onclick="storePopupBgClick(event)">
  <div class="store-popup">
    <div class="store-popup-header">
      <div class="store-popup-title">Laden wählen</div>
    </div>
    <div class="store-add-row">
      <input class="store-add-inp" id="storeAddInp" type="text" placeholder="Neuer Laden…" autocomplete="off">
      <button class="store-add-btn" onclick="addCustomStore()">＋</button>
    </div>
    <div id="storeListItems"></div>
  </div>
</div>

<div class="store-popup-bg" id="favPopupBg" onclick="favPopupBgClick(event)">
  <div class="store-popup">
    <div class="store-popup-header">
      <div class="store-popup-title">Favoriten</div>
    </div>
    <div id="favListItems"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
const STORAGE_KEY = 'liste_v2';
let data = loadData();
let activeListId = data.activeListId;
let items = getActiveItems();
let customStores = data.customStores || [];
let savedLocations = data.savedLocations || [];
let activeLocationIdx = data.activeLocationIdx ?? -1;
let activeFilters = data.activeFilters || ['food','drug'];
let selectedStore = '';
let editId = null;
let lastDeleted = null;
let toastTimer = null;
let cdInterval = null;
let searchVisible = false;
const SHOP_CATEGORIES = [
  {id:'food', label:'🛒 Lebensmittel', types:['supermarket','convenience','greengrocer','butcher','bakery','cheese','seafood','pastry','deli']},
  {id:'drug', label:'🧴 Drogerie', types:['chemist','cosmetics','hairdresser','beauty','optician']},
  {id:'wholesale', label:'📦 Großhandel', types:['wholesale']},
  {id:'other', label:'🏪 Sonstiges', types:['variety_store','department_store','doityourself','furniture','electronics','clothes','shoes','books']}
];

/* ═══════════════════════════════════════════════════
   DATA HELPERS
═══════════════════════════════════════════════════ */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.lists && d.lists.length) return d;
    }
  }catch(e){}
  // migrate from old version if present
  try{
    const old = localStorage.getItem('mylist_v6');
    if(old){
      const items = JSON.parse(old);
      return {
        version:2,
        activeListId:'default',
        lists:[{id:'default', name:'Einkauf', items:items||[], budget:null}],
        customStores:[],
        savedLocations:[],
        activeLocationIdx:-1,
        activeFilters:['food','drug'],
        history:[]
      };
    }
  }catch(e){}
  return {
    version:2,
    activeListId:'default',
    lists:[{id:'default', name:'Einkauf', items:[], budget:null}],
    customStores:[],
    savedLocations:[],
    activeLocationIdx:-1,
    activeFilters:['food','drug'],
    history:[]
  };
}
function saveData(){
  // sync current items back
  const list = data.lists.find(l=>l.id===activeListId);
  if(list) list.items = items;
  data.customStores = customStores;
  data.savedLocations = savedLocations;
  data.activeLocationIdx = activeLocationIdx;
  data.activeFilters = activeFilters;
  data.activeListId = activeListId;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getActiveItems(){
  const list = data.lists.find(l=>l.id===activeListId);
  return list ? (list.items||[]) : [];
}
function getActiveList(){
  return data.lists.find(l=>l.id===activeListId) || data.lists[0];
}
function switchList(id){
  saveData();
  activeListId = id;
  items = getActiveItems();
  selectedStore = '';
  updateStorePickUI();
  document.getElementById('currentListName').textContent = getActiveList().name;
  closeListsModal();
  render();
  saveData();
  showToast('Liste gewechselt');
  vibrate(10);
}
function createList(){
  const name = (document.getElementById('newListName').value||'').trim();
  if(!name){showToast('Name eingeben');return;}
  const id = 'l_'+Date.now();
  data.lists.push({id, name, items:[], budget:null});
  document.getElementById('newListName').value = '';
  switchList(id);
  buildListsUI();
}
function deleteList(id, e){
  e.stopPropagation();
  if(data.lists.length<=1){showToast('Mindestens eine Liste behalten');return;}
  if(!confirm('Liste wirklich löschen?'))return;
  data.lists = data.lists.filter(l=>l.id!==id);
  if(activeListId===id){
    activeListId = data.lists[0].id;
    items = getActiveItems();
    document.getElementById('currentListName').textContent = getActiveList().name;
  }
  saveData();
  buildListsUI();
  render();
  showToast('Liste gelöscht');
}
function buildListsUI(){
  const c = document.getElementById('listsContainer');
  c.innerHTML = '';
  data.lists.forEach(l=>{
    const open = (l.items||[]).filter(i=>!i.done).length;
    const d = document.createElement('div');
    d.className = 'list-item-row'+(l.id===activeListId?' active':'');
    d.innerHTML = `<span class="l-name">${esc(l.name)}</span><span class="l-count">${open} offen</span><span class="l-check">✓</span>
      <button style="background:none;border:none;color:var(--danger);font-size:14px;padding:4px;cursor:pointer" onclick="deleteList('${l.id}',event)">✕</button>`;
    d.onclick = ()=>switchList(l.id);
    c.appendChild(d);
  });
}
function openListsModal(){buildListsUI();document.getElementById('listsBg').classList.add('open');}
function closeListsModal(){document.getElementById('listsBg').classList.remove('open');}

/* ═══════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cap(s){return s? s.charAt(0).toUpperCase()+s.slice(1):'';}
function fmtPrice(v){return v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms);}
function showToast(msg, undoFn){
  const t = document.getElementById('toast');
  const msgEl = document.getElementById('toastMsg');
  msgEl.innerHTML = esc(msg) + (undoFn ? ' <button class="undo" id="undoBtn">Rückgängig</button>' : '');
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  if(undoFn){
    document.getElementById('undoBtn').onclick = ()=>{undoFn();t.classList.remove('show');};
  }
  toastTimer = setTimeout(()=>t.classList.remove('show'), undoFn?4000:2400);
}

/* ═══════════════════════════════════════════════════
   UI TOGGLES
═══════════════════════════════════════════════════ */
let addedCount=0;
function toggleInputPanel(force){
  const p=document.getElementById('inputPanel');
  const btn=document.getElementById('addToggleBtn');
  const open=(typeof force==='boolean')?force:!p.classList.contains('open');
  p.classList.toggle('open',open);
  document.getElementById('panelScrim').classList.toggle('open',open);
  btn.classList.toggle('open',open);
  btn.textContent=open?'✕':'＋';
  if(open){
    addedCount=0;document.getElementById('panelCount').textContent='';
    updateFavBtnState();renderSugg();
    setTimeout(()=>document.getElementById('inp').focus(),120);
  }else{
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    p.style.transform='';
  }
}
// Nach unten wischen schließt das Fenster
(function(){
  const p=document.getElementById('inputPanel');let y0=null,dy=0;
  p.addEventListener('touchstart',e=>{if(e.target.closest('.panel-handle,.panel-head')&&!e.target.closest('button')){y0=e.touches[0].clientY;dy=0;p.style.transition='none';}},{passive:true});
  p.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>8)p.style.transform='translateY('+(dy-8)+'px)';},{passive:true});
  p.addEventListener('touchend',()=>{if(y0===null)return;p.style.transition='';const close=dy>90;y0=null;if(close)toggleInputPanel(false);else p.style.transform='';});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&p.classList.contains('open'))toggleInputPanel(false);});
})();
function toggleSearch(){
  searchVisible = !searchVisible;
  document.getElementById('searchWrap').classList.toggle('show', searchVisible);
  if(searchVisible) document.getElementById('searchInp').focus();
  else {document.getElementById('searchInp').value='';render();}
}
function openSettings(){
  const list = getActiveList();
  document.getElementById('budgetInp').value = list.budget!=null ? String(list.budget).replace('.',',') : '';
  document.getElementById('settingsPlz').value = '';
  document.getElementById('settingsCity').value = '';
  buildFilterChips();
  buildSavedLocationsList();
  document.getElementById('settingsBg').classList.add('open');
}
function closeSettings(){document.getElementById('settingsBg').classList.remove('open');}

/* ═══════════════════════════════════════════════════
   QTY / PRICE / STORE
═══════════════════════════════════════════════════ */
function getQty(){const v=document.getElementById('qtyVal').value.trim();const n=parseInt(v);return isNaN(n)||n<1?1:n;}
function setQty(n){document.getElementById('qtyVal').value=Math.max(1,n);}
function changeQty(d){setQty(getQty()+d);}
document.getElementById('qtyVal').addEventListener('change',()=>setQty(getQty()));
document.getElementById('qtyVal').addEventListener('blur',()=>setQty(getQty()));

function getPrice(){
  const v=(document.getElementById('priceInp').value||'').trim().replace(',','.');
  const n=parseFloat(v);
  return isNaN(n)||n<0?null:Math.round(n*100)/100;
}
function updateStorePickUI(){
  const btn=document.getElementById('storePickBtn');
  const lbl=document.getElementById('storePickLabel');
  if(selectedStore){
    lbl.textContent=selectedStore;
    btn.classList.add('has');
  }else{
    lbl.textContent='Laden';
    btn.classList.remove('has');
  }
}
function clearStore(){selectedStore='';updateStorePickUI();}

/* ═══════════════════════════════════════════════════
   FAVORITEN
═══════════════════════════════════════════════════ */
function isFavorite(name){
  const favs=data.favorites||[];
  return favs.some(f=>f.toLowerCase()===name.toLowerCase());
}
function toggleFavorite(){
  const inp=document.getElementById('inp');
  const raw=inp.value.trim();
  if(!raw) return;
  const name=cap(raw);
  data.favorites=data.favorites||[];
  if(isFavorite(name)){
    data.favorites=data.favorites.filter(f=>f.toLowerCase()!==name.toLowerCase());
  }else{
    data.favorites.unshift(name);
    if(data.favorites.length>20) data.favorites.length=20;
  }
  saveData();
  updateFavBtnState();
  vibrate(10);
}
function updateFavBtnState(){
  const inp=document.getElementById('inp');
  const btn=document.getElementById('favBtn');
  const raw=inp.value.trim();
  const active = !!raw && isFavorite(cap(raw));
  btn.textContent = active ? '★' : '☆';
  btn.classList.toggle('active', active);
}
document.getElementById('inp').addEventListener('input', updateFavBtnState);

function openFavPopup(){
  buildFavList();
  document.getElementById('favPopupBg').classList.add('open');
}
function closeFavPopup(){document.getElementById('favPopupBg').classList.remove('open');}
function favPopupBgClick(e){if(e.target===document.getElementById('favPopupBg'))closeFavPopup();}

function buildFavList(){
  const list=document.getElementById('favListItems');
  const favs=data.favorites||[];
  list.innerHTML='';
  if(!favs.length){
    const hint=document.createElement('div');

═══════════════════════════════════════════════════ */
function addItem(){
  const inp=document.getElementById('inp');
  const raw=inp.value.trim();
  if(!raw) return;
  let name=raw, itemQty=getQty();
  const m=raw.match(/^(\d+)[x×\s]\s*(.+)$/i);
  if(m){itemQty=parseInt(m[1]);name=cap(m[2].trim());}
  else name=cap(raw);

  const price=getPrice();

  items.unshift({
    id:(window._newId=Date.now()+Math.random()),
    name, qty:itemQty, unit:'', cat:'', prio:0, note:'',
    done:false, store:selectedStore||'', price
  });
  saveData();
  render();
  {const n=document.querySelector('[data-id="'+window._newId+'"]');if(n)n.classList.add('pop');}
  inp.value='';
  setQty(1);
  document.getElementById('priceInp').value='';
  updateFavBtnState();renderSugg();
  // keep store for faster consecutive adds
  inp.focus();
  addedCount++;document.getElementById('panelCount').textContent=addedCount+' hinzugefügt';
  showToast(name+(selectedStore?' · '+selectedStore:'')+' hinzugefügt');
  vibrate(12);
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});
document.getElementById('priceInp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addItem();}});

function toggle(id){
  const it=items.find(i=>i.id===id);
  if(!it) return;
  it.done=!it.done;
  saveData();
  render();
  checkAllDone();
  vibrate(8);
}
function del(id){
  const it=items.find(i=>i.id===id);
  if(!it) return;
  lastDeleted={...it, _idx:items.findIndex(i=>i.id===id)};
  items=items.filter(i=>i.id!==id);
  saveData();
  render();
  showToast(it.name+' gelöscht', ()=>{
    if(lastDeleted){
      items.splice(lastDeleted._idx,0,lastDeleted);
      delete lastDeleted._idx;
      lastDeleted=null;
      saveData();
      render();
    }
  });
  checkAllDone();
}
function clearDone(){
  const n=items.filter(i=>i.done).length;
  if(!n) return;
  items=items.filter(i=>!i.done);
  saveData();
  render();
  cancelAutoDelete();
  showToast(n+' erledigt geleert');
}
function clearAll(){
  if(!items.length) return;
  if(!confirm('Wirklich alle '+items.length+' Artikel löschen?')) return;
  items=[];
  saveData();
  render();
  cancelAutoDelete();
  showToast('Liste geleert');
}
function checkAllDone(){
  if(items.length>0 && items.every(i=>i.done)) startCountdown();
  else cancelAutoDelete();
}
function startCountdown(){
  cancelAutoDelete();
  const bar=document.getElementById('cdBar'), fill=document.getElementById('cdFill'), txt=document.getElementById('cdText');
  bar.classList.add('show');
  let secs=5;
  fill.style.width='100%';
  txt.textContent='Liste wird in '+secs+'s geleert…';
  cdInterval=setInterval(()=>{
    secs--;
    fill.style.width=(secs/5*100)+'%';
    txt.textContent='Liste wird in '+secs+'s geleert…';
    if(secs<=0){
      cancelAutoDelete();
      items=[];
      saveData();
      render();
      showToast('Alles erledigt 🎉');
    }
  },1000);
}
function cancelAutoDelete(){
  clearInterval(cdInterval);
  cdInterval=null;
  document.getElementById('cdBar').classList.remove('show');
}

function shareList(){
  const open=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);
  let text = '🛒 '+getActiveList().name+'\n\n';
  if(open.length){
    text += 'Offen:\n';
    open.forEach(i=>{
      text += '☐ '+i.name+(i.qty&&i.qty!=1?' ('+i.qty+(i.unit?' '+i.unit:'')+'×)':'')+(i.store?' @ '+i.store:'')+'\n';
    });

    text += '\nErledigt:\n';
    done.forEach(i=>{text += '☑ '+i.name+'\n';});

    navigator.share({title:getActiveList().name, text}).catch(()=>{});

}

function isStoreValid(store){
  if(!store) return true;
  if(!customStores.length) return true;
  return customStores.some(s=>s.toLowerCase()===store.toLowerCase());
}

function render(){
  const q = (document.getElementById('searchInp')?.value||'').toLowerCase().trim();
  let open = items.filter(i=>!i.done);
  let done = items.filter(i=>i.done);
  if(q){
    open = open.filter(i=>i.name.toLowerCase().includes(q)||(i.store||'').toLowerCase().includes(q));
    done = done.filter(i=>i.name.toLowerCase().includes(q)||(i.store||'').toLowerCase().includes(q));
  }

  // sort open: prio desc, then name
  open.sort((a,b)=>(b.prio||0)-(a.prio||0) || a.name.localeCompare(b.name,'de'));

  const total=items.length, dn=items.filter(i=>i.done).length, pct=total?Math.round(dn/total*100):0;
  document.getElementById('totalCount').textContent=total;
  document.getElementById('doneCount').textContent=dn;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=total?pct+'%':'—';
  document.getElementById('openLbl').textContent='Offen'+(open.length?' ('+open.length+')':'');

  // prices
  const totalPrice=items.reduce((s,i)=>s+(i.price!=null?i.price*(i.qty||1):0),0);
  const donePrice=items.filter(i=>i.done).reduce((s,i)=>s+(i.price!=null?i.price*(i.qty||1):0),0);
  const hasPrices=items.some(i=>i.price!=null);
  const statsBar=document.getElementById('statsBar');
  if(hasPrices){
    statsBar.classList.remove('no-prices');
    document.getElementById('priceTotal').textContent=fmtPrice(totalPrice);
    document.getElementById('priceDone').textContent=fmtPrice(donePrice);
  }else statsBar.classList.add('no-prices');

  // budget
  const list=getActiveList();
  const budgetWrap=document.getElementById('budgetWrap');
  if(list.budget!=null && list.budget>0){
    budgetWrap.style.display='block';
    const pctB=Math.min(100, Math.round(totalPrice/list.budget*100));
    document.getElementById('budgetLabel').textContent=fmtPrice(totalPrice)+' / '+fmtPrice(list.budget);
    const fill=document.getElementById('budgetFill');
    fill.style.width=pctB+'%';
    fill.classList.toggle('budget-over', totalPrice>list.budget);
  }else budgetWrap.style.display='none';

  function makeItem(it){
    const d=document.createElement('div');
    d.className='item'+(it.done?' done':'')+(it.prio===2?' prio-high':it.prio===1?' prio-med':'');
    const qtyStr = (it.qty&&it.qty!=1 ? it.qty+(it.unit?' '+it.unit:'')+'×' : (it.unit||''));
    const priceStr = it.price!=null ? fmtPrice(it.price*(it.qty||1)) : '';
    d.innerHTML=`
      <div class="item-check"><span class="item-check-mark">✓</span></div>
      <div class="item-main">
        <span class="item-name">${esc(it.name)}</span>
      </div>
      <div class="item-right">
        ${qtyStr?`<span class="item-qty">${esc(qtyStr)}</span>`:''}
        ${priceStr?`<span class="item-price">${priceStr}</span>`:''}
      </div>`;
    d.dataset.id=it.id;d.addEventListener('click',()=>toggle(it.id));
    d.addEventListener('contextmenu',e=>{e.preventDefault();openEdit(it.id);});
    // long press for edit on mobile
    let lp=null;
    d.addEventListener('touchstart',()=>{lp=setTimeout(()=>openEdit(it.id),550);},{passive:true});
    d.addEventListener('touchend',()=>clearTimeout(lp));
    d.addEventListener('touchmove',()=>clearTimeout(lp));
    return d;
  }

  const lo=document.getElementById('listOpen');
  lo.innerHTML='';
  if(!open.length){
    lo.innerHTML=`<div class="empty"><div class="empty-icon">${items.length===0?'🛒':'🎉'}</div><p>${items.length===0?'Noch nichts auf der Liste.<br>Tippe auf + und leg los.':(q?'Keine Treffer.':'Alles erledigt!')}</p></div>`;
  }else{
    const groups={};
    open.forEach(i=>{const k=i.store||'';if(!groups[k])groups[k]=[];groups[k].push(i);});
    const keys=Object.keys(groups).sort((a,b)=>{if(!a)return 1;if(!b)return -1;return a.localeCompare(b,'de');});
    keys.forEach(key=>{
      const lbl=document.createElement('div');
      const grpTotal=groups[key].reduce((s,i)=>s+(i.price!=null?i.price*(i.qty||1):0),0);
      const hasP=groups[key].some(i=>i.price!=null);
      if(key){
        lbl.className='store-group';
        lbl.innerHTML=`<span>${esc(key)}</span>${hasP?`<span class="grp-price">${fmtPrice(grpTotal)}</span>`:''}`;
      }else{
        lbl.className='store-group everywhere';
        lbl.innerHTML=`<span>Überall</span>${hasP?`<span class="grp-price">${fmtPrice(grpTotal)}</span>`:''}`;
      }
      lo.appendChild(lbl);
      groups[key].forEach(i=>lo.appendChild(makeItem(i)));
    });
  }

  const ld=document.getElementById('listDone');
  ld.innerHTML='';
  const ds=document.getElementById('doneSec');
  if(done.length){ds.style.display='block';done.forEach(i=>ld.appendChild(makeItem(i)));}
  else ds.style.display='none';

  document.getElementById('currentListName').textContent = getActiveList().name;
}

async function saveSettings(){
  // budget
  const bv=(document.getElementById('budgetInp').value||'').trim().replace(',','.');
  const bn=parseFloat(bv);
  const list=getActiveList();
  list.budget = (bv===''||isNaN(bn)||bn<=0) ? null : Math.round(bn*100)/100;
  saveData();
  render();

  const plz=document.getElementById('settingsPlz').value.trim();
  const city=document.getElementById('settingsCity').value.trim();
  if(!plz && !city){
    showToast('Budget gespeichert');
    return;
  }
  const btn=document.getElementById('searchBtn');
  btn.disabled=true;btn.textContent='Suche läuft…';
  const query = (plz&&city)?`${plz} ${city}`:(city||plz);
  await loadStoresByLocation(query,plz,city);
  btn.disabled=false;btn.textContent='Läden laden';
  hideSearchProgress();
}

async function loadStoresByLocation(query,plz,city){
  try{
    setSearchProgress(15,'Ort wird gesucht…');
    const geoResp=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&countrycodes=de&accept-language=de`);
    if(!geoResp.ok) throw new Error('Ortssuche fehlgeschlagen');
    const geoData=await geoResp.json();
    if(!geoData.length){showToast('Ort nicht gefunden');hideSearchProgress();return;}
    setSearchProgress(35,'Koordinaten gefunden…');
    const {lat,lon,display_name}=geoData[0];
    const stadtName=city||display_name.split(',')[0];
    const radius=8000;
    const activeCats=activeFilters.length?SHOP_CATEGORIES.filter(c=>activeFilters.includes(c.id)):SHOP_CATEGORIES;
    const shopTypes=[...new Set(activeCats.flatMap(c=>c.types))];
    setSearchProgress(50,'Läden werden gesucht…');
    const typeLines=shopTypes.flatMap(t=>[
      `node["shop"="${t}"](around:${radius},${lat},${lon});`,
      `way["shop"="${t}"](around:${radius},${lat},${lon});`
    ]).join('');
    const q=`[out:json][timeout:25];(${typeLines});out tags;`;
    const ovResp=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});
    if(!ovResp.ok) throw new Error('Overpass nicht erreichbar');
    setSearchProgress(80,'Verarbeite…');
    const ovData=await ovResp.json();
    const seen=new Set();const found=[];
    ovData.elements.forEach(el=>{
      const t=el.tags||{};
      const raw=(t.brand||t['brand:de']||t.name||t['name:de']||'').trim();
      if(!raw) return;
      if(['yes','no','shop','store'].includes(raw.toLowerCase())) return;
      const name=raw.replace(/\s+/g,' ').trim();
      if(!name||seen.has(name.toLowerCase())) return;
      seen.add(name.toLowerCase());found.push(name);
    });
    found.sort((a,b)=>a.localeCompare(b,'de'));
    setSearchProgress(95,'Speichere…');
    const locName=stadtName+(plz?' ('+plz+')':'');
    const existIdx=savedLocations.findIndex(l=>l.name===locName);
    if(existIdx>=0){
      const existSet=new Set(savedLocations[existIdx].stores.map(s=>s.toLowerCase()));
      found.forEach(n=>{if(!existSet.has(n.toLowerCase())) savedLocations[existIdx].stores.push(n);});
      activeLocationIdx=existIdx;
    }else{
      savedLocations.push({name:locName,plz,city:stadtName,lat:parseFloat(lat),lon:parseFloat(lon),stores:found});
      activeLocationIdx=savedLocations.length-1;
    }
    customStores=[...savedLocations[activeLocationIdx].stores];
    saveData();
    setSearchProgress(100,'Fertig');
    buildSavedLocationsList();
    render();
    showToast(found.length?found.length+' Läden in '+locName:'Keine Läden gefunden');
  }catch(err){
    console.error(err);
    showToast(err.message||'Fehler bei der Suche');
    hideSearchProgress();
  }
}

async function exportBackup(){
  try{
    saveData();
    const json=JSON.stringify(data,null,2);
    const fileName='liste-backup-'+new Date().toISOString().slice(0,10)+'.json';
    if(window.showSaveFilePicker){
      try{
        const fh=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'JSON',accept:{'application/json':['.json']}}]});
        const w=await fh.createWritable();
        await w.write(json);await w.close();
        showToast('Backup gespeichert');
        return;
      }catch(e){if(e.name==='AbortError')return;}
    }
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    showToast('Backup wird heruntergeladen');
  }catch(err){showToast('Export fehlgeschlagen');}
}
function importBackup(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      let converted;
      if(d.lists && Array.isArray(d.lists)){
        converted=d;
      }else if(Array.isArray(d.items)){
        // altes Backup-Format (Version 1, ohne Mehrfachlisten)
        converted={
          version:2,
          activeListId:'default',
          lists:[{id:'default', name:'Einkauf', items:d.items||[], budget:null}],
          customStores:d.customStores||[],
          savedLocations:d.savedLocations||[],
          activeLocationIdx:d.activeLocationIdx??-1,
          activeFilters:d.activeFilters||d.shopFilters||['food','drug'],
          favorites:d.favorites||[]
        };
      }else{
        showToast('Ungültige Datei');
        event.target.value='';
        return;
      }
      if(!confirm('Backup laden? Aktuelle Daten werden überschrieben.')){event.target.value='';return;}
      data=converted;
      activeListId=data.activeListId||data.lists[0].id;
      items=getActiveItems();
      customStores=data.customStores||[];
      savedLocations=data.savedLocations||[];
      activeLocationIdx=data.activeLocationIdx??-1;
      activeFilters=data.activeFilters||['food','drug'];
      saveData();
      render();
      showToast('Backup wiederhergestellt');
    }catch(err){showToast('Fehler beim Lesen');}
    event.target.value='';
  };
  reader.readAsText(file);
}

/* Tastatur: Fenster bleibt oben auf der Tastatur, Knöpfe nehmen den Fokus nicht weg */
(function(){
  const p=document.getElementById('inputPanel');
  function place(){
    const vv=window.visualViewport;if(!vv)return;
    const kb=Math.max(0,Math.round(document.documentElement.clientHeight-vv.height-vv.offsetTop));
    p.style.bottom=kb+'px';
    p.style.maxHeight=Math.round(vv.height*0.94)+'px';
  }
  if(window.visualViewport){visualViewport.addEventListener('resize',place);visualViewport.addEventListener('scroll',place);}
  place();
  p.querySelectorAll('button').forEach(b=>{
    if(b.classList.contains('panel-close'))return;
    b.addEventListener('pointerdown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')e.preventDefault();});
  });
  const q=document.getElementById('qtyVal');
  q.addEventListener('focus',()=>setTimeout(()=>{try{q.select()}catch(e){}},0));
})();
/* ═══ Premium: Vorschläge, Wischen, Zahlen-Animation ═══ */
function renderSugg(){
  const box=document.getElementById('sugg'),inp=document.getElementById('inp');
  if(!box||!inp)return;
  const q=inp.value.trim().toLowerCase();
  const favs=(data.favorites||[]).slice();
  const seen=new Set(),all=[];
  favs.forEach(n=>{const k=n.toLowerCase();if(!seen.has(k)){seen.add(k);all.push({n,fav:true});}});
  data.lists.forEach(l=>(l.items||[]).forEach(i=>{const k=(i.name||'').toLowerCase();if(k&&!seen.has(k)){seen.add(k);all.push({n:i.name,fav:false});}}));
  let res=q?all.filter(a=>a.n.toLowerCase().includes(q)&&a.n.toLowerCase()!==q).sort((a,b)=>(b.n.toLowerCase().startsWith(q))-(a.n.toLowerCase().startsWith(q))):all.filter(a=>a.fav);
  res=res.slice(0,8);
  box.innerHTML='';
  res.forEach(a=>{const b=document.createElement('button');b.type='button';b.textContent=a.n;if(a.fav)b.className='fav';b.onclick=()=>{inp.value=a.n;inp.focus();updateFavBtnState();renderSugg();vibrate(8);};box.appendChild(b);});
}
document.getElementById('inp').addEventListener('input',renderSugg);
document.getElementById('sugg').addEventListener('pointerdown',e=>e.preventDefault());

(function(){
  ['listOpen','listDone'].forEach(id=>{
    const el=document.getElementById(id);let t=null;
    el.addEventListener('touchstart',e=>{const it=e.target.closest('.item');if(!it||e.touches.length>1)return;t={it,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,on:false};},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(!t)return;
      const dx=e.touches[0].clientX-t.x,dy=e.touches[0].clientY-t.y;
      if(!t.on){
        if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){t.on=true;t.it.style.transition='none';}
        else if(Math.abs(dy)>10){t=null;return;}
      }
      if(t.on){t.dx=dx;t.it.style.transform='translateX('+(dx*0.7)+'px)';t.it.classList.toggle('sw-r',dx>70);t.it.classList.toggle('sw-l',dx<-70);}
    },{passive:true});
    el.addEventListener('touchend',()=>{
      if(!t)return;const {it,dx,on}=t;t=null;if(!on)return;
      it.style.transition='';it.style.transform='';it.classList.remove('sw-r','sw-l');
      window._swipedAt=Date.now();
      const obj=items.find(i=>String(i.id)===it.dataset.id);if(!obj)return;
      if(dx>90)toggle(obj.id);else if(dx<-90)del(obj.id);
    });
    el.addEventListener('click',e=>{if(Date.now()-(window._swipedAt||0)<400){e.stopPropagation();e.preventDefault();}},true);
  });
})();

(function(){
  const el=document.getElementById('priceTotal');if(!el)return;
  let cur=null,busy=false,raf=0;
  const parse=t=>parseFloat(String(t).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.'))||0;
  const fmt=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  new MutationObserver(()=>{
    if(busy)return;
    const target=parse(el.textContent),text=el.textContent;
    if(cur===null||matchMedia('(prefers-reduced-motion:reduce)').matches){cur=target;return;}
    const from=cur;cur=target;if(from===target)return;
    cancelAnimationFrame(raf);const t0=performance.now();
    (function step(now){
      const k=Math.min(1,(now-t0)/450),e=1-Math.pow(1-k,3);
      busy=true;el.textContent=k<1?fmt(from+(target-from)*e):text;busy=false;
      if(k<1)raf=requestAnimationFrame(step);
    })(t0);
  }).observe(el,{childList:true,characterData:true,subtree:true});
})();
</script>
